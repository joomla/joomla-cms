name: CI Joomla

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  composer:
    name: Install PHP dependencies
    runs-on: ubuntu-latest
    container: joomlaprojects/docker-images:php8.4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache-php
        with:
          path: libraries/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
      - name: Install PHP dependencies
        if: steps.cache-php.outputs.cache-hit != 'true'
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          composer config --global home
          composer validate --no-check-all --strict
          composer install --no-progress --ignore-platform-reqs

  npm:
    name: Install JS/CSS dependencies and build assets
    runs-on: ubuntu-latest
    container: joomlaprojects/docker-images:php8.4
    needs: [composer]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: latest
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache-assets
        with:
          path: |
            node_modules
            media
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'build/media_source/**', 'administrator/components/com_media/resources/**') }}
      - uses: actions/cache/restore@v4
        with:
          path: libraries/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
      - name: Build assets
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: npm ci --unsafe-perm

  tests-system-prepare:
    name: Prepare system tests
    runs-on: ubuntu-latest
    container: joomlaprojects/docker-images:cypress8.4
    needs: [composer, npm]
    env:
      CYPRESS_VERIFY_TIMEOUT: 100000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            media
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'build/media_source/**', 'administrator/components/com_media/resources/**') }}
      - uses: actions/cache@v4
        id: cache-cypress
        with:
          path: |
            /root/.cache/Cypress
            /github/home/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('package-lock.json') }}
      - name: Install Cypress dependencies
        if: steps.cache-cypress.outputs.cache-hit != 'true'
        run: |
          npx cypress install
          npx cypress verify

  tests-system:
    name: Run system tests
    runs-on: ubuntu-latest
    container: joomlaprojects/docker-images:cypress${{ matrix.config.php_version }}
    needs: [tests-system-prepare]
    strategy:
      matrix:
        config:
          - php_version: '8.4'
            test_group: cmysqlmax
            db_engine: mysqli
            db_host: mysql
            my_version: '8.4'
          - php_version: '8.3'
            test_group: cmysql
            db_engine: mysqli
            db_host: mysql
            my_version: '8.0.13'
          - php_version: '8.4'
            test_group: cmariamax
            db_engine: mysqli
            db_host: maria
            maria_version: '12.0'
          - php_version: '8.3'
            test_group: cmaria
            db_engine: mysqli
            db_host: maria
            maria_version: '10.4'
          - php_version: '8.3'
            test_group: cpostgres
            db_engine: pgsql
            db_host: postgres
            pg_version: '12.0'
          - php_version: '8.4'
            test_group: cpostgresmax
            db_engine: pgsql
            db_host: postgres
            pg_version: '18.0'
    env:
      JOOMLA_INSTALLATION_DISABLE_LOCALHOST_CHECK: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: libraries/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            media
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'build/media_source/**', 'administrator/components/com_media/resources/**') }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            /root/.cache/Cypress
            /github/home/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('package-lock.json') }}
      - name: Run System tests
        run: bash tests/System/entrypoint.sh "$(pwd)" ${{ matrix.config.test_group }} ${{ matrix.config.db_engine }} ${{ matrix.config.db_host }} electron
      - name: Archive test results results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-test-output
          path: tests/System/output
          if-no-files-found: ignore
    services:
      mysql:
        image: mysql:${{ matrix.config.my_version || '8.4' }}
        env:
          MYSQL_USER: joomla_ut
          MYSQL_PASSWORD: joomla_ut
          MYSQL_ROOT_PASSWORD: joomla_ut
          MYSQL_DATABASE: test_joomla
      maria:
        image: mariadb:${{ matrix.config.maria_version || '12.0' }}
        env:
          MARIADB_USER: joomla_ut
          MARIADB_PASSWORD: joomla_ut
          MARIADB_ROOT_PASSWORD: joomla_ut
          MARIADB_DATABASE: test_joomla
      postgres:
        image: postgres:${{ matrix.config.pg_version || '18' }}-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: joomla_ut
          POSTGRES_DB: test_joomla
