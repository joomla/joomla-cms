; Module title and description
MOD_PERFORMANCE_INSPECTOR="Performance Inspector"
MOD_PERFORMANCE_INSPECTOR_DESCRIPTION="Real-time performance monitoring and metrics display for Joomla administrators. Shows execution time, database queries, memory usage, and cache information."

; Basic settings
MOD_PERFORMANCE_INSPECTOR_SHOW_EXECUTION_TIME="Show Execution Time"
MOD_PERFORMANCE_INSPECTOR_SHOW_EXECUTION_TIME_DESC="Display the total page execution time in milliseconds"

MOD_PERFORMANCE_INSPECTOR_SHOW_QUERIES="Show Database Queries"
MOD_PERFORMANCE_INSPECTOR_SHOW_QUERIES_DESC="Display the number of database queries executed and total query time"

MOD_PERFORMANCE_INSPECTOR_SHOW_MEMORY="Show Memory Usage"
MOD_PERFORMANCE_INSPECTOR_SHOW_MEMORY_DESC="Display current and peak memory usage in MB"

MOD_PERFORMANCE_INSPECTOR_SHOW_SLOWEST_QUERY="Show Slowest Query"
MOD_PERFORMANCE_INSPECTOR_SHOW_SLOWEST_QUERY_DESC="Display the slowest executed database query with execution time"

MOD_PERFORMANCE_INSPECTOR_SHOW_CACHE_INFO="Show Cache Information"
MOD_PERFORMANCE_INSPECTOR_SHOW_CACHE_INFO_DESC="Display cache hit and miss statistics (if available)"

MOD_PERFORMANCE_INSPECTOR_MAX_QUERY_LENGTH="Maximum Query Length"
MOD_PERFORMANCE_INSPECTOR_MAX_QUERY_LENGTH_DESC="Maximum number of characters to display from SQL queries (50-1000)"

; Advanced settings
MOD_PERFORMANCE_INSPECTOR_UPDATE_INTERVAL="Update Interval (ms)"
MOD_PERFORMANCE_INSPECTOR_UPDATE_INTERVAL_DESC="How often to refresh performance data in milliseconds (1000-30000)"

MOD_PERFORMANCE_INSPECTOR_DEBUG_MODE="Debug Mode"
MOD_PERFORMANCE_INSPECTOR_DEBUG_MODE_DESC="Show additional debug information including PHP version, cache handler, and memory limits"

MOD_PERFORMANCE_INSPECTOR_POSITION_X="Horizontal Position"
MOD_PERFORMANCE_INSPECTOR_POSITION_X_DESC="Position the module panel on the left or right side of the screen"

MOD_PERFORMANCE_INSPECTOR_POSITION_Y="Vertical Position"
MOD_PERFORMANCE_INSPECTOR_POSITION_Y_DESC="Position the module panel at the top or bottom of the screen"

MOD_PERFORMANCE_INSPECTOR_LEFT="Left"
MOD_PERFORMANCE_INSPECTOR_RIGHT="Right"
MOD_PERFORMANCE_INSPECTOR_TOP="Top"
MOD_PERFORMANCE_INSPECTOR_BOTTOM="Bottom"
