COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_DESCRIPTION="<h1 class=\"fw-medium\">Welcome to Joomla 6!</h1><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_0/cassiopeiacolors.jpg\" alt=\"Display the backend template style customizer\" width=\"640\" height=\"380\"></div><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">Cassiopeia Enhancements</h2><p>Update the font sizes and colors without having to edit a custom CSS file.</p></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-12 mb-3\"><h2 class=\"mb-3\">Extended Versioning</h2><p>Joomla's versioning system now includes support for custom fields, allowing changes to field values to be tracked and restored just like standard content.</p></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_TITLE="What's New in Joomla 6!"
