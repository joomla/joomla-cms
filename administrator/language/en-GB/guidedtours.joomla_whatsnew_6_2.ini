COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">Welcome to Joomla 6.2!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">Core Updates</h2><div class=\"col-12 mb-3\"><h3>Content Editing Upgrades</h3><ul><li><strong>Media Manager/Read More integrations</strong>: Adding images and media has gotten easier with the updated picker that now opens the Joomla Media Manager, and the new Read More button provides a quicker way to insert article breaks.</li><li><strong>Separate image and figure classes</strong>: Article intro/full-text images now have independent CSS class fields for the image and its surrounding figure element.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Sublevel menus\" width=\"383\" height=\"280\" loading=\"lazy\" style=\"display: block; margin-left: auto; margin-right: auto;\"></div><div class=\"col-md-6 col-lg-5\"><h3>Front-End Template (Cassiopeia)</h3><ul><li><strong>Multi-level dropdown menus</strong>: Cassiopeia menus now support more than one sublevel in dropdown/collapsible layouts.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>Modules &amp; Site Configuration</h3><ul class=\"mb-3\"><li><strong>mod_login link toggles</strong>: New options let admins hide the “Forgot your password?” and “Forgot your username?” links without a template override. Defaults to Show, so no impact on existing sites.</li><li><strong>Security flag for extension updates</strong>: Developers can flag a release as a security update (severity None to Critical); flagged updates are highlighted in Components -&gt; Update and on the dashboard quick icon.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Security tags on extensions\" width=\"488\" height=\"144\" loading=\"lazy\" style=\"display: block; margin-left: auto; margin-right: auto;\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="What’s New in Joomla 6.2!"
