COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_STEP_0_DESCRIPTION="<h3>Joomla 6.2 Full Release Notes</h3><p><a title=\"Full release notes\" href=\"https://www.joomla.org/announcements.html\" target=\"_blank\" rel=\"noopener noreferrer\">View the full release notes on joomla.org</a></p><hr><h3>Help and Information</h3><p class=\"mb-3\">Many resources to help you can be found here together with additional links to more resources, documentation, support and how to become involved in Joomla.</p><p><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_2/help_index.jpg\" alt=\"New help index\" width=\"450\" height=\"275\" loading=\"lazy\" style=\"display: block; margin-left: auto; margin-right: auto;\"></p>"
