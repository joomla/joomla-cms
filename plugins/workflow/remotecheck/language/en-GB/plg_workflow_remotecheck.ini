PLG_WORKFLOW_REMOTECHECK="Workflow - Remote Check"
PLG_WORKFLOW_REMOTECHECK_AUTHHEADER_DESC="The header the service expects the credential in. Common values are Authorization and X-API-Key."
PLG_WORKFLOW_REMOTECHECK_AUTHHEADER_LABEL="Authentication Header"
PLG_WORKFLOW_REMOTECHECK_AUTHVALUE_DESC="The credential to send in that header, for example &quot;Bearer abc123&quot;. Leave empty for a service that needs no authentication."
PLG_WORKFLOW_REMOTECHECK_AUTHVALUE_LABEL="Authentication Value"
PLG_WORKFLOW_REMOTECHECK_CACHELIFETIME_DESC="How many minutes an answer is reused before the service is asked again. The check is also resolved when an administrator opens the article list, so a very short lifetime puts an external service in the way of pages loading. A long one means the workflow acts on information that old."
PLG_WORKFLOW_REMOTECHECK_CACHELIFETIME_LABEL="Cache Lifetime (minutes)"
PLG_WORKFLOW_REMOTECHECK_CHECKLABEL_DESC="What to call this check in the condition builder. Use the name your service uses, so the person building a rule recognises it."
PLG_WORKFLOW_REMOTECHECK_CHECKLABEL_LABEL="Check Name"
PLG_WORKFLOW_REMOTECHECK_ENDPOINT_DESC="The service to ask. It receives {&quot;ids&quot;: [1, 2, 3]} as JSON and should answer with {&quot;flags&quot;: {&quot;1&quot;: true, &quot;2&quot;: false}}. Leave an article out of the answer to say that its state is unknown, and no rule will act on it."
PLG_WORKFLOW_REMOTECHECK_ENDPOINT_LABEL="Service Endpoint"
PLG_WORKFLOW_REMOTECHECK_TIMEOUT_DESC="How many seconds to wait for the service before giving up. On a timeout no article is judged either way, so no rule fires on a guess."
PLG_WORKFLOW_REMOTECHECK_TIMEOUT_LABEL="Timeout (seconds)"
PLG_WORKFLOW_REMOTECHECK_XML_DESCRIPTION="Adds an automation condition check whose answer comes from an external web service rather than from the Joomla database, so transitions can be gated on a system outside the site."
